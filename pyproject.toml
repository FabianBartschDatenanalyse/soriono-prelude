[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soriono-prelude"
version = "0.3.0rc1"
description = "Grundfunktionen für den vollständigen profilierten Schweizer Open-Data-Katalog."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "duckdb>=1.4.0",
  "httpx>=0.27.0",
  "mcp>=1.13.0",
  "sqlglot>=30.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pyyaml>=6.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
soriono-prelude = "soriono_prelude.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["online: tests requiring public services"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
