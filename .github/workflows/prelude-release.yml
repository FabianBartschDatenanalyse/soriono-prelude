name: Soriono Prelude release gates

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["soriono-prelude-v*"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - shell: pwsh
        run: ./scripts/fetch_catalog.ps1
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev ruff check .

  release-gates:
    if: startsWith(github.ref, 'refs/tags/soriono-prelude-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - shell: pwsh
        run: ./scripts/fetch_catalog.ps1
      - run: python scripts/validate_catalog_release.py
      - run: uv run --frozen python scripts/validate_retrieval_goldset.py
      - run: uv run --frozen python scripts/benchmark_retrieval.py --enforce
      - run: uv run --frozen python scripts/validate_document_release.py
      - run: >
          uv run --frozen python scripts/validate_geodata_release.py
          --report docs/geodata-audit-0.3.json

  bundle:
    if: startsWith(github.ref, 'refs/tags/soriono-prelude-v') || github.event_name == 'workflow_dispatch'
    needs: [test, release-gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - shell: pwsh
        run: ./scripts/fetch_catalog.ps1
      - shell: pwsh
        run: ./scripts/build_mcpb.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-soriono-prelude
          path: dist/*.mcpb
          if-no-files-found: error

  mcpb-smoke:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-soriono-prelude
          path: artifacts
      - shell: pwsh
        run: |
          $artifact = Get-ChildItem artifacts -Filter *.mcpb | Select-Object -First 1
          ./scripts/test_mcpb_startup.ps1 -Artifact $artifact.FullName

  release:
    if: startsWith(github.ref, 'refs/tags/soriono-prelude-v')
    needs: mcpb-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-soriono-prelude
          path: downloaded
      - name: Verify signed release tag
        shell: bash
        run: |
          gpg --batch --import security/release-signing-key.asc
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/release-verification"
          git verify-tag refs/tags/release-verification
          test "$(git rev-list -n 1 refs/tags/release-verification)" = "$GITHUB_SHA"
      - name: Place exact tested MCPB
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $artifact = Get-ChildItem downloaded -Filter *.mcpb | Select-Object -First 1
          Copy-Item $artifact.FullName (Join-Path dist $artifact.Name) -Force
      - name: Create checksum and SBOM
        shell: pwsh
        run: |
          ./scripts/package_release.ps1 -SkipBuild
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body: |
            Soriono Prelude Release Candidate.

            Herkunft und Integrität werden durch den GPG-signierten Git-Tag,
            die veröffentlichte SHA-256-Prüfsumme und die CycloneDX-SBOM
            abgesichert. Das MCPB selbst besitzt in dieser kostenlosen
            Release-Stufe noch kein kommerzielles Code-Signing-Zertifikat.
          files: |
            dist/*.mcpb
            dist/*.sha256
            dist/*.cdx.json
